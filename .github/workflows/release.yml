name: Build & Release Installer

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # ── Windows NSIS installer ─────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build webpack bundle
        run: npm run build

      - name: Build Windows installer (NSIS x64)
        run: npx electron-builder --win --publish never

      - name: Verify dist artifacts match latest.yml
        run: npm run verify-dist

      - name: Upload Windows installer to release
        uses: softprops/action-gh-release@v2
        with:
          # The auto-updater needs latest.yml + the .blockmap alongside the .exe,
          # otherwise it fails with a checksum mismatch / missing manifest.
          files: |
            dist/Lighting-Plot-Setup.exe
            dist/Lighting-Plot-Setup.exe.blockmap
            dist/latest.yml
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── macOS DMG (Intel x64 + Apple Silicon arm64) ────────────────────────────
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build webpack bundle
        run: npm run build

      # ── Code signing (optional — skipped if secrets not set) ──────────────
      # To enable signing, add these secrets in GitHub repo Settings → Secrets:
      #   APPLE_CERTIFICATE      — base64-encoded .p12 Developer ID certificate
      #   APPLE_CERTIFICATE_PWD  — certificate password
      #   APPLE_ID               — your Apple ID email
      #   APPLE_ID_PASSWORD      — app-specific password from appleid.apple.com
      #   APPLE_TEAM_ID          — your Apple Developer Team ID
      - name: Import Apple certificate (if available)
        if: ${{ env.APPLE_CERTIFICATE != '' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PWD: ${{ secrets.APPLE_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH -P "$APPLE_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" $KEYCHAIN_PATH

      - name: Build macOS DMG + zip (x64 + arm64)
        run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS DMGs and zips to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Lighting-Plot-x64.dmg
            dist/Lighting-Plot-arm64.dmg
            dist/Lighting-Plot-x64.zip
            dist/Lighting-Plot-arm64.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
