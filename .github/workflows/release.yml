name: Build & Release Installer

on:
  push:
    tags:
      - 'v*.*.*'

# NOTE: Windows is built and released MANUALLY from a Windows dev machine
# (npm run dist:win → gh release create, which uploads the .exe + .blockmap +
# latest.yml together). CI must NOT also build Windows: a second, separately
# signed Windows .exe has a different sha512, and replacing just one of the
# three Windows artifacts on the release breaks the auto-updater with a
# checksum mismatch. CI therefore only builds macOS — the platform that cannot
# be produced on the Windows dev machine. The Windows (latest.yml) and macOS
# (latest-mac.yml) update manifests are separate files and never collide.
jobs:
  # ── macOS DMG (Intel x64 + Apple Silicon arm64) ────────────────────────────
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    # Job-level flag so step `if:` conditions can branch on whether an Apple
    # signing certificate secret is configured (secrets can't be used directly
    # in `if:`, but env can).
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build webpack bundle
        run: npm run build

      # ── Code signing (optional — only runs if signing secrets are set) ────
      # To enable signing, add these secrets in GitHub repo Settings → Secrets:
      #   APPLE_CERTIFICATE      — base64-encoded .p12 Developer ID certificate
      #   APPLE_CERTIFICATE_PWD  — certificate password
      #   APPLE_ID               — your Apple ID email
      #   APPLE_ID_PASSWORD      — app-specific password from appleid.apple.com
      #   APPLE_TEAM_ID          — your Apple Developer Team ID
      - name: Import Apple certificate
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PWD: ${{ secrets.APPLE_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH -P "$APPLE_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" $KEYCHAIN_PATH

      # Signed build — certificate is in the keychain; electron-builder
      # auto-discovers the identity, and notarises if APPLE_ID secrets exist.
      - name: Build macOS DMG + zip (signed)
        if: env.HAS_APPLE_CERT == 'true'
        run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Unsigned build — no certificate configured. Disable identity discovery
      # so electron-builder produces an unsigned app instead of erroring on an
      # empty CSC_LINK.
      - name: Build macOS DMG + zip (unsigned)
        if: env.HAS_APPLE_CERT != 'true'
        run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify dist artifacts match latest-mac.yml
        run: npm run verify-dist

      - name: Upload macOS DMGs and zips to release
        uses: softprops/action-gh-release@v2
        with:
          # latest-mac.yml + the .zip files are required for macOS auto-update.
          # artifactName is "Lighting-Plot.${ext}"; electron-builder appends the
          # arch for the second arch, so match both bare and arch-suffixed names.
          files: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
